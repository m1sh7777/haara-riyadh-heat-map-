            <span className="ml-auto mb-1 inline-flex items-center gap-1 font-mono text-[10px] tabular-nums"
              style={{ color: trend > 0.15 ? '#E0904A' : (trend < -0.15 ? '#6FA7BE' : '#7C8A9C') }}>
              {trend > 0.15 ? <I n="chevup" size={11}/> : trend < -0.15 ? <I n="chevdown" size={11}/> : <I n="steady" size={11}/>}
              {Math.abs(trend).toFixed(1)}°/H
            </span>
          </div>

          <div className="mt-3.5">
            <div className="inline-flex items-center gap-2 rounded-full border px-3 py-[6px]"
              style={{ borderColor: sev.color + '59', color: sev.color, background: sev.color + '14' }}>
              <span className="w-[6px] h-[6px] rounded-full" style={{ background: sev.color }}/>
              <span className="font-mono text-[10px] tracking-[0.22em]">{sev.label}</span>
            </div>
          </div>

          <div className="mt-6">
            <div className="flex items-baseline justify-between">
              <span className="font-mono text-[9px] tracking-[0.22em] text-slate-500">
                {snap.source === 'live' ? 'FORECAST · 24H' : 'THERMAL MODEL · 24H'}
              </span>
              <span className="font-mono text-[9px] text-slate-600">
                {snap.scrubbed ? 'SCRUB ' : 'LOCAL '}{hhmm(snap.hour)}
              </span>
            </div>
            <div className="mt-2"><Sparkline g={g} rec={rec} hour={snap.hour}/></div>
            <div className="flex justify-between font-mono text-[8px] text-slate-600 mt-1">
              <span>−24H</span><span>{snap.scrubbed ? hhmm(snap.hour) : 'NOW'}</span>
            </div>
          </div>

          <div className="mt-6 divide-y divide-white/[0.06] border-y border-white/[0.06]">
            {rows.map(r => (
              <div key={r.label} className="flex items-center gap-3 py-[11px]">
                <I n={r.icon} className="text-slate-600 shrink-0" size={14}/>
                <span className="font-mono text-[9.5px] tracking-[0.2em] text-slate-500">{r.label}</span>
                <span className="flex-1 border-b border-dotted border-white/[0.08] -translate-y-[3px]"/>
                <span className="font-mono text-[12px] text-slate-200">{r.value}</span>
              </div>
            ))}
          </div>

          <div className="mt-6 pt-4 border-t border-white/[0.06]">
            <p className="font-mono text-[9px] text-slate-500 tracking-[0.14em]">
              {snap.scrubbed
                ? `${snap.source === 'live' ? 'FORECAST' : 'MODEL'} PROJECTION · ${hhmm(snap.hour)} AST`
                : snap.source === 'live'
                  ? (snap.stale ? `FEED STALLED · LAST ${snap.updated} AST` : `OPEN-METEO · UPDATED ${snap.updated} AST`)
                  : `FEED UPDATED ${snap.updated} AST`}
            </p>
            <p className="mt-1 font-mono text-[9px] text-slate-600 tracking-[0.14em]">
              {snap.scrubbed
                ? (snap.source === 'live' ? 'OPEN-METEO HOURLY FORECAST — NOT LIVE' : '24H SCRUB VIEW — SIMULATED MODEL')
                : snap.source === 'live'
                  ? 'LIVE · 2 M AIR TEMP — NOT SATELLITE LST'
                  : 'SIMULATED MODEL — NOT LIVE OBSERVATIONS'}
            </p>
            {snap.scrubbed && (
              <button type="button" onClick={onLive}
                className="mt-3 inline-flex items-center gap-1.5 font-mono text-[9px] tracking-[0.18em] text-[#D8A24B] border border-[#D8A24B]/40 hover:bg-[#D8A24B]/10 rounded-full px-2.5 py-1.5 transition-colors">
                <I n="live" size={10}/> RETURN TO LIVE
              </button>
            )}
          </div>
        </div>
      )}
    </aside>
  );
}

/* =====================================================================
 * APP
 * ===================================================================== */
function App() {
  const liveSnap = useSyncExternalStore(SOURCE.subscribe, SOURCE.getSnapshot);
  const feed = liveSnap.feed;
  const [selectedId, setSelectedId] = useState(null);
  const [ping, setPing] = useState(null);
  const [scrubHour, setScrubHour] = useState(null); // null → live; [0,24) → 24h scrub view
  const [playing, setPlaying] = useState(false);
  const [colMin, setColMin] = useState(false);      // mobile-only: instrument column collapsed
  const reduced = useReducedMotion();
  const clock = useRiyadhClock();

  const liveHourRef = useRef(liveSnap.hour); liveHourRef.current = liveSnap.hour;

  // the view every component consumes: live snapshot, or the active
  // provider (real forecast or simulated model) at the scrub hour
  const view = scrubHour == null ? liveSnap : SOURCE.project(scrubHour);

  // extreme-heat early-warning scan: only while viewing live (not scrubbed),
  // recomputed whenever the active feed advances
  const ahead = useMemo(
    () => (scrubHour == null ? SOURCE.nextExtreme(ALERT_T) : null),
    [liveSnap, scrubHour == null]
  );
  const [alertToast, dismissAlert] = useExtremeAlert(view, ahead, playing);

  // playback: a full 24h cycle in ~14 s (discrete 30-min steps if motion is reduced)
  useEffect(() => {
    if (!playing) return;
    if (reduced) {
      const iv = setInterval(() => setScrubHour(h => qz((h ?? liveHourRef.current) + 0.5)), 400);
      return () => clearInterval(iv);
    }
    let raf = 0, last = performance.now();
    const SPEED = 24 / 14; // hours per second
    const loop = t => {
      const dt = Math.min((t - last) / 1000, 0.1); last = t;
      setScrubHour(h => qz((h ?? liveHourRef.current) + dt * SPEED));
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf);
  }, [playing, reduced]);

  const handleSelect = useCallback((id) => {
    setSelectedId(id);
    if (id && !reduced) setPing({ id, at: Date.now() }); else setPing(null);
  }, [reduced]);

  const handleScrubTime = useCallback((h) => { setPlaying(false); setScrubHour(qz(h)); }, []);
  const handleLive = useCallback(() => { setPlaying(false); setScrubHour(null); }, []);
  const handleMode = useCallback((m) => { SOURCE.setMode(m); }, []);

  // toast "click to view": jump to the warned district — and, for forecast
  // alerts, to the exact warned hour on the 24 h timeline
  const handleToastView = useCallback((a) => {
    dismissAlert(a.key);
    setPlaying(false);
    handleSelect(a.districtId);
    if (a.kind === 'ahead' || a.kind === 'scrub') setScrubHour(qz(a.hour));
    else handleLive();
  }, [dismissAlert, handleSelect, handleLive]);

  return (
    <div className="h-full">
      <div className={`map-wrap fixed inset-0 z-0 flex items-center justify-center ${selectedId ? 'panel-open' : ''}`}>
        <MapSvg snap={view} selectedId={selectedId} ping={ping} onSelect={handleSelect} reduced={reduced}/>
      </div>
      <TopBar clock={clock} snap={view} onSelect={handleSelect} feed={feed}
        model={scrubHour == null ? null : hhmm(scrubHour)}/>

      {/* left instrument column: source toggle, 24h scrubber, legend.
          MOBILE ONLY: collapsible to a compact strip (chevron, 44px targets);
          ≥sm always renders the full column, unaffected by colMin. The
          collapse state is fully independent of map zoom/pan. */}
      <div className="fixed left-3 bottom-3 sm:left-5 sm:bottom-5 z-40 pointer-events-none">
        {/* compact strip (mobile, collapsed) — live mean + status + expand */}
        <div className={`col-mini ${colMin ? '' : 'off'}`}>
          <button type="button" onClick={() => setColMin(false)} aria-expanded="false"
            aria-label="Expand instrument panel"
            className="pointer-events-auto glass rounded-full h-[44px] pl-4 pr-3 flex items-center gap-2.5 select-none">
            <span className="font-mono text-[14px] tabular-nums leading-none" style={{ color: rampColor(view.mean) }}>{view.mean.toFixed(1)}°</span>
            <span className="font-mono text-[8px] tracking-[0.22em] text-slate-500 leading-none">MEAN</span>
            <span className="font-mono text-[8px] tracking-[0.14em] text-slate-600 leading-none">
              {view.scrubbed
                ? `${view.source === 'live' ? 'FCST' : 'MODEL'} ${hhmm(view.hour)}`
                : (view.source === 'live' ? 'LIVE' : 'SIM')}
            </span>
            <span className="ml-0.5 text-slate-400"><I n="chevup" size={15}/></span>
          </button>
        </div>

        {/* full column (always visible ≥sm) */}
        <div className={`col-body ${colMin ? 'off' : ''} flex flex-col items-start gap-3 pointer-events-none`}>
          <button type="button" onClick={() => setColMin(true)} aria-expanded="true"
            aria-label="Collapse instrument panel"
            className="sm:hidden self-end pointer-events-auto w-[44px] h-[44px] rounded-full glass flex items-center justify-center text-slate-400 hover:text-slate-100 transition-colors">
            <I n="chevdown" size={16}/>
          </button>
          <SourceToggle feed={feed} updated={liveSnap.updated} onMode={handleMode}/>
          <TimeScrubber view={view} liveHour={liveSnap.hour} dataT={liveSnap.t} scrubbed={scrubHour != null}
            playing={playing} reduced={reduced}
            onScrub={handleScrubTime} onLive={handleLive} onPlaying={setPlaying}/>
          <Legend snap={view} selectedId={selectedId}/>
        </div>
      </div>

      {/* extreme-heat alert toast — top-center below the header, shifts
          clear of the readout panel on desktop like the map does */}
      <div className={`toast-layer fixed inset-0 z-[65] flex justify-center items-start pointer-events-none pt-[136px] sm:pt-[92px] ${selectedId ? 'panel-open' : ''}`}>
        {alertToast && <ExtremeToast alert={alertToast} onDismiss={dismissAlert} onView={handleToastView}/>}
      </div>

      <InfoPanel snap={view} selectedId={selectedId} onClose={() => setSelectedId(null)} onLive={handleLive}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
